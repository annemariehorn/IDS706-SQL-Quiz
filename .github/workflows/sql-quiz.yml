name: SQL Quiz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py questions.py

      - name: Verify quiz configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from questions import questions

          assert os.environ.get("SUPABASE_URL"), "Missing SUPABASE_URL secret"
          assert len(questions) == 5, "Expected 5 questions"
          assert sum(q["points"] for q in questions) == 20, "Quiz must total 20 points"

          for question in questions:
              assert question["question"]
              assert question["hint"]
              assert question["expected_sql"]
              assert question["expected_result"]

          print("Quiz configuration checks passed!")
          PY
