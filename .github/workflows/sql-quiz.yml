name: SQL Quiz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py questions.py

      - name: Verify quiz configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from questions import questions

          assert os.environ.get("SUPABASE_URL"), "Missing SUPABASE_URL secret"
          assert len(questions) == 5, "Expected 5 questions"
          assert sum(q["points"] for q in questions) == 20, "Quiz must total 20 points"

          for question in questions:
              assert question["question"]
              assert question["hint"]
              assert question["expected_sql"]
              assert question["expected_result"]

          print("Quiz configuration checks passed!")
          PY

      - name: Test PostgreSQL connection
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              sslmode="require",
              connect_timeout=10,
          )

          with connection.cursor() as cursor:
              cursor.execute("SELECT COUNT(*) FROM students;")
              count = cursor.fetchone()[0]
              print(f"Database connection successful! Students: {count}")

          connection.close()
          PY
